<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="wcAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Subtle Grid Accent -->
  <path d="M12 24h40M12 40h40M24 12v40M40 12v40" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />

  <!-- Geometric 'W' & 'C' Craft Symbol -->
  <!-- Left Wing of W -->
  <path d="M15 20L23 44L28 32L24 20H15Z" fill="url(#wcGrad)" filter="url(#glow)" />
  
  <!-- Right Wing of W merged with C curve -->
  <path d="M49 20L41 44L36 32L40 20H49Z" fill="url(#wcGrad)" filter="url(#glow)" />
  
  <!-- Center Diamond Matrix (Craft Node) -->
  <polygon points="32,24 38,34 32,44 26,34" fill="url(#wcAccent)" />
  
  <!-- Center Core Dot -->
  <circle cx="32" cy="34" r="2.5" fill="#ffffff" />
</svg>